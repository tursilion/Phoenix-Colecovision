# Phoenix PC Engine loader: 16K ROM at $C000-$FFFF (MPR6 = bank 1, MPR7 =
# bank 0; bin2hex.py swaps the halves so the $E000 half is bank 0), the 8K
# work RAM at $2000 (zero page $2000, stack $2100, C data from $2200, the
# SD sector cache at $3A00, the C stack below $4000).
SYMBOLS {
    __STACKSIZE__: type = weak, value = $0400;
}
MEMORY {
    ZP:   file = "", define = yes, start = $0000, size = $0100;
    RAM:  file = "", define = yes, start = $2200, size = $1800;
    ROM:  file = %O, define = yes, start = $C000, size = $3FF6, fill = yes, fillval = $FF;
    VEC:  file = %O,               start = $FFF6, size = $000A;
}
SEGMENTS {
    ZEROPAGE: load = ZP,  type = zp;
    ONCE:     load = ROM, type = ro,  optional = yes;
    CODE:     load = ROM, type = ro;
    RODATA:   load = ROM, type = ro;
    DATA:     load = ROM, run = RAM, type = rw, define = yes;
    # in bank 0, the only one mapped at reset
    STARTUP:  load = ROM, type = ro,  start = $FF80;
    BSS:      load = RAM, type = bss, define = yes;
    VECTORS:  load = VEC, type = ro;
}
FEATURES {
    CONDES: type = constructor, label = __CONSTRUCTOR_TABLE__,
            count = __CONSTRUCTOR_COUNT__, segment = ONCE;
    CONDES: type = destructor, label = __DESTRUCTOR_TABLE__,
            count = __DESTRUCTOR_COUNT__, segment = RODATA;
}
